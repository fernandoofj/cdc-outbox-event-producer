// SonarCloud configuration is parked until the project is re-enrolled
// under a personal/organization SonarCloud account.
// Replace `<owner>` and `<key>` and set SONAR_TOKEN in repository secrets
// before re-enabling the CI workflow step.
sonarqube {
    properties {
        property "sonar.projectName", "cdc-outbox-event-producer"
        property "sonar.projectKey", "<owner>_cdc-outbox-event-producer"
        property "sonar.organization", "<owner>"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.kotlin.detekt.reportPaths", "build/reports/detekt/detekt.xml"
    }
}
