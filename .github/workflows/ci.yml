# CI pipeline for cdc-outbox-event-producer (NF1).
#
# Two jobs, mutually exclusive by trigger:
#
#   * build   — runs on every push to main and every pull_request
#               targeting main. Compiles Kotlin, runs the default test
#               sweep (Testcontainers ITs gated by RUN_TESTCONTAINERS=1
#               are NOT exercised here — see "Testcontainers in CI"
#               below) and enforces zero Detekt issues.
#
#   * publish — runs ONLY on push of a version tag matching `v*`
#               (e.g. `v0.1.0`). Publishes every module's Maven
#               artifact to GitHub Packages. Gated on `build`
#               succeeding so we never publish a red commit.
#
# Testcontainers in CI: the three Postgres+SNS / MySQL+RabbitMQ /
# AtLeastOnceDelivery integration tests are skipped because GitHub's
# hosted runners do not ship the OrbStack daemon configuration this
# repo's developers use locally (DOCKER_API_VERSION=1.43). They are
# expected to run locally before tagging a release:
#
#     RUN_TESTCONTAINERS=1 DOCKER_API_VERSION=1.43 ./gradlew test
#
# Cache: actions/setup-java@v5 with `cache: gradle` handles the
# ~/.gradle/caches and ~/.gradle/wrapper caching automatically — no
# explicit actions/cache step needed.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # build — compile + default test sweep + detekt.
  # Runs on every push to main and every PR. Gates the publish job.
  # ---------------------------------------------------------------
  build:
    name: Build, test and detekt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      - name: Compile Kotlin (main + test)
        run: ./gradlew compileKotlin compileTestKotlin

      # Default sweep excludes the docker-compose lifecycle tasks that
      # the `:legacy` module piggy-backs on the root `test` graph.
      # Without RUN_TESTCONTAINERS=1 the three Testcontainers ITs
      # skip themselves at @EnabledIfEnvironmentVariable time.
      - name: Run tests (default sweep, no Testcontainers)
        run: ./gradlew test -x startDockerCompose -x stopDockerCompose

      - name: Detekt (zero issues)
        run: ./gradlew detekt

      # Upload reports so failures are debuggable from the GitHub UI
      # without re-running the build locally. Only on failure to keep
      # storage usage low.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
            **/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------
  # publish — Maven publication to GitHub Packages.
  # Triggered ONLY by a tag matching `v*` (the workflow `on:` block
  # already gates the trigger; the `if:` here is belt-and-braces in
  # case the workflow is re-used). Depends on `build` so a tag that
  # fails CI never produces artifacts. The Gradle `publishing` block
  # in build.gradle.kts reads `GITHUB_ACTOR` and `GITHUB_TOKEN` from
  # the environment for the GitHubPackages repository credentials.
  # ---------------------------------------------------------------
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 21 (Corretto)
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle

      - name: Publish all modules to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
